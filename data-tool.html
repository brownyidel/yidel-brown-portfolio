<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CleanCSV — Data Tool Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#091421;color:#f4f8ff}.wrap{width:min(1000px,calc(100% - 30px));margin:auto;padding:45px 0}
a{color:#77a7ff;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:start;gap:20px}.k{color:#69a0ff;font-size:11px;font-weight:800;letter-spacing:.14em}.head h1{font-size:42px;letter-spacing:-.04em;margin:9px 0}.sub{color:#95a8bf;line-height:1.6}.tool{margin-top:30px;background:#0e1d2f;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;margin-bottom:8px;font-weight:700;font-size:13px}textarea{width:100%;height:320px;background:#07111d;color:#dceaff;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:14px;resize:vertical;font-family:ui-monospace,monospace;line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#4d8fff;color:#06101c}.btn.secondary{background:#182a40;color:#dceaff}.stats{display:flex;gap:20px;margin-top:15px;color:#9bb0c8;font-size:12px}.stats b{color:#fff}
.note{margin-top:18px;color:#7389a3;font-size:12px}.demo{padding:5px 8px;background:#18304b;border-radius:6px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.head{flex-direction:column}.head h1{font-size:34px}}
</style></head>
<body><div class="wrap"><div class="head"><div><div class="k">WORKING DEMO PROJECT</div><h1>CleanCSV</h1><div class="sub">Paste CSV data, clean whitespace, remove blank rows, and de-duplicate exact records — entirely in your browser.</div></div><a href="index.html">← Back to portfolio</a></div>
<div class="tool"><div class="grid"><div><label>Raw CSV</label><textarea id="input">name,email,city
 Alice , alice@example.com , London
Bob,bob@example.com,Manchester

Alice , alice@example.com , London
Charlie,charlie@example.com,Leeds</textarea></div><div><label>Cleaned CSV</label><textarea id="output" readonly></textarea></div></div>
<div class="actions"><button class="btn" onclick="cleanCSV()">Clean data</button><button class="btn secondary" onclick="copyOut()">Copy result</button><button class="btn secondary" onclick="resetDemo()">Reset demo</button></div>
<div class="stats"><span>Input rows: <b id="inRows">0</b></span><span>Output rows: <b id="outRows">0</b></span><span>Removed: <b id="removed">0</b></span></div>
<div class="note"><span class="demo">Demo</span> This simple portfolio utility processes text locally and does not upload data anywhere.</div></div></div>
<script>
const original=document.getElementById('input').value;
function cleanCSV(){
 const raw=document.getElementById('input').value.split(/\r?\n/);
 const cleaned=raw.map(line=>line.split(',').map(v=>v.trim()).join(',')).filter(line=>line.trim()!=='');
 const unique=[...new Set(cleaned)];
 document.getElementById('output').value=unique.join('\n');
 document.getElementById('inRows').textContent=raw.filter(x=>x.trim()).length;
 document.getElementById('outRows').textContent=unique.length;
 document.getElementById('removed').textContent=raw.filter(x=>x.trim()).length-unique.length;
}
async function copyOut(){await navigator.clipboard.writeText(document.getElementById('output').value);alert('Cleaned CSV copied.');}
function resetDemo(){document.getElementById('input').value=original;document.getElementById('output').value='';cleanCSV();}
cleanCSV();
</script></body></html>
